name: Deploy VPS

on:
  push:
    branches: [produccion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-produccion
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/produccion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Desplegar el commit por SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Falta VPS_HOST}"
          : "${VPS_USER:?Falta VPS_USER}"
          : "${VPS_SSH_KEY:?Falta VPS_SSH_KEY}"
          : "${VPS_KNOWN_HOSTS:?Falta VPS_KNOWN_HOSTS}"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/alas_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/alas_deploy" >/dev/null
          ssh -T -i "$HOME/.ssh/alas_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "${VPS_USER}@${VPS_HOST}" "deploy ${GITHUB_SHA}"
